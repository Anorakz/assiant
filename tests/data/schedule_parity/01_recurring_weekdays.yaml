# ============================================================================
#  跨实现一致性夹具 01 — recurring 的星期各种写法
#
#  固定"现在" = 2026-09-21 15:00（周一），所以 mon/0 命中今天、tue/1 命中明天。
#  期望文件由 tests/test_schedule_parity.py 用真的 Scheduler 生成，别手写。
# ============================================================================
scheduler:
  interval_min: 1
  recurring:
    - state: study
      start: "10:00"
    - state: game
      days: [mon]
      start: "09:00"
    - state: sleep
      days: [tue]
      start: "09:30"
    - state: idle
      days: [0]
      start: "08:00"
    - state: study
      days: [MON]
      start: "08:01"
    - state: game
      days: [monday]
      start: "08:02"
    - state: sleep
      days: []
      start: "23:00"
