# ============================================================================
#  跨实现一致性夹具 03 — 时间写法的容错
#
#  最后两条故意"不加引号"：PyYAML 看它们仍是字符串（YAML 1.1 的整数规则不匹配），
#  所以两边都该解析成 09:30。真正会被判成整数的写法（`9:30` 不加引号 = 六十进制）
#  不放进夹具 —— 那条只在 gui/tests/test_schedule_model.cpp 里单测。
# ============================================================================
scheduler:
  recurring:
    - title: 一位小时
      start: "9:30"
    - title: 两位小时
      start: "09:30"
    - title: 紧凑带引号
      start: "0930"
    - title: 紧凑不加引号
      start: 0930
    - title: 全角冒号
      start: "09：30"
