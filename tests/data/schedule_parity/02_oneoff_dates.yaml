# ============================================================================
#  跨实现一致性夹具 02 — oneoff 的日期：今天 / 明天 / 过去 / 未来
#
#  "下周一"用 2026-09-28（今天是 09-21，周一）。
# ============================================================================
scheduler:
  oneoff:
    - state: study
      date: 2026-09-21
      start: "14:00"
    - state: game
      date: 2026-09-22
      start: "08:00"
    - state: sleep
      date: 2026-09-20
      start: "09:00"
    - state: idle
      date: 2026-09-28
      start: "09:00"
