# ============================================================================
#  跨实现一致性夹具 02 — oneoff 的日期：今天 / 明天 / 过去 / 未来
#
#  "下周一"用 2026-09-28（今天是 09-21，周一）。
# ============================================================================
scheduler:
  oneoff:
    - title: 今天评审
      date: 2026-09-21
      start: "14:00"
      end: "15:30"
    - title: 明天体检
      date: 2026-09-22
      start: "08:00"
    - title: 昨天的事
      date: 2026-09-20
      start: "09:00"
    - title: 下周一的事
      date: 2026-09-28
      start: "09:00"
