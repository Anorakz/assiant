# ============================================================================
#  跨实现一致性夹具 04 — 同一时刻的排序
#
#  两条 09:00 用来钉住"同一时间按**状态名**排序"这条显示规则（两边必须一致）。
# ============================================================================
scheduler:
  recurring:
    - state: study
      start: "09:00"
    - state: game
      start: "09:00"
    - state: sleep
      start: "14:00"
    - state: idle
      start: "11:59"
