# ============================================================================
#  跨实现一致性夹具 07 — 一条坏日程
#
#  Python 遇到坏条目会抛 SchedulerError（**整份拒绝**，Agent 起不来）。
#  期望文件里记 python_ok=false；C++ 侧要求"不崩，并且把问题暴露出来"。
# ============================================================================
scheduler:
  recurring:
    - state: study
      start: "09:00"
    - state: game
      start: "99:99"
