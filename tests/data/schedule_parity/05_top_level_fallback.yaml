# ============================================================================
#  跨实现一致性夹具 05 — 逐键回落顶层
#
#  scheduler 段里有 oneoff、顶层有 recurring：
#  Python 的 _load_events 是**逐键**回落的（section.get(key) 找不到再 self._config.get(key)），
#  所以两条都该被装载。这条最容易写错。
# ============================================================================
scheduler:
  interval_min: 1
  oneoff:
    - title: 段里的
      date: 2026-09-21
      start: "09:00"
recurring:
  - title: 顶层的
    start: "08:00"
