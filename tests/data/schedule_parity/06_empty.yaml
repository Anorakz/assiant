# ============================================================================
#  跨实现一致性夹具 06 — 完全没有日程
#
#  这是板端现在的真实状态：scheduler 段只有 commands，没有任何 recurring/oneoff。
#  两边都该"成功但空"，而不是报错。
# ============================================================================
llm:
  mode: disabled
scheduler:
  interval_min: 1
  window_min: 1
  commands: []
