# assistant（T15-2-11 板端实测）：默认的 Google NTP 池在国内网络下不通，换国内源
#
# 现象：buildroot 编译进的默认池是 time1..4.google.com，板端 timesyncd 日志全是
#     Timed out waiting for reply from 216.239.35.4:123 (time2.google.com).
# 于是 `System clock synchronized: no`，板子时间停在 RTC 里的旧值（实测停在
# 2024-01-25，差两年多）—— 时间不对会连带影响 TLS 证书校验（云端 LLM / OTA）
# 与日志排序。
# 实测这三家都回包且服务器时间正确；换上之后板端日志：
#     Contacted time server 203.107.6.88:123 (ntp.aliyun.com).
#     Initial clock synchronization to Fri 2026-10-02 16:40:21 CST
#     System clock synchronized: yes
#
# ⚠ 为什么放在 overlay 而不是 post-build 里 heredoc：T15-2-11 实测 —— 同一次
#   post-build 里 nm-online 的 drop-in 建出来了、这一份却没有（文件在全 SDK 里
#   都找不到），而它之后的步骤都正常执行。overlay 是**直接拷文件**，没有这类
#   解释器/here-doc 的坑（udev 规则那条路已经验证过）。
[Time]
NTP=ntp.aliyun.com cn.pool.ntp.org ntp.tencent.com
FallbackNTP=ntp.aliyun.com cn.pool.ntp.org
