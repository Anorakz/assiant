# ============================================================================
#  config/user_profile.example.yaml — 用户画像模板
#
#  用法:
#      cp config/user_profile.example.yaml config/user_profile.yaml
#
#  ⚠ config/user_profile.yaml 不进 git (里面是个人信息, 不该进版本库);
#     本模板文件才进 git。
#  ⚠ agent/config.py 不做 schema 校验 —— 下面的字段是约定的起始形态,
#     各模块按需增删, 缺字段时自己给默认值。
# ============================================================================

# 称呼
name: 主人
# 回复语言, 例如 zh-CN / en-US
language: zh-CN

# ---------------------------------------------------------------------------
# 偏好
# ---------------------------------------------------------------------------
preferences:
  # 回复风格: concise = 尽量短, normal = 正常, detailed = 展开解释
  style: concise
  # 主动提醒的积极程度: low / normal / high
  proactive_level: normal
  # 免打扰时段 (24 小时制, 跨零点写成 23:00-07:00 也可以)
  quiet_hours: "23:00-07:00"

# ---------------------------------------------------------------------------
# 常用信息 (给日程 / 自动填表用)
# ---------------------------------------------------------------------------
contacts:
  - name: 张三
    relation: 同事
    email: zhangsan@example.com
  - name: 李四
    relation: 家人
    phone: "13800000000"

# 常用地点, 供"去公司"这类说法解析
places:
  home: 家里
  office: 公司
  studio: 工作室

# ---------------------------------------------------------------------------
# 自由备注: 给 LLM 当补充上下文, 结构随意
# ---------------------------------------------------------------------------
notes:
  - 早上 9 点前不要安排会议
  - 周五下午通常在外面
