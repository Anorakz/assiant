# ============================================================================
#  config/schedule.example.yaml — 日程模板
#
#  用法:
#      cp config/schedule.example.yaml config/schedule.yaml
#
#  ⚠ config/schedule.yaml 不进 git (含个人日程); 本模板文件才进 git。
#  ⚠ agent/config.py 不做 schema 校验 —— 时间格式、重复规则是否合法,
#     由读它的模块(日程模块)自己判断。
# ============================================================================

# 时区。板端系统时区可能不是本地时区, 显式写清楚避免解析歧义。
timezone: Asia/Shanghai

# ---------------------------------------------------------------------------
# 定期事件: 每周固定时间发生
# ---------------------------------------------------------------------------
recurring:
  - title: 站会
    # 星期: mon/tue/wed/thu/fri/sat/sun
    days: [mon, tue, wed, thu, fri]
    start: "09:30"
    end: "09:45"
    # 提前多少分钟提醒
    remind_before_min: 5

  - title: 周报
    days: [fri]
    start: "16:00"
    end: "17:00"
    remind_before_min: 15

# ---------------------------------------------------------------------------
# 一次性事件: 只在指定日期发生
# ---------------------------------------------------------------------------
oneoff:
  - title: 项目评审
    date: 2026-09-20
    start: "14:00"
    end: "15:30"
    location: 会议室 A
    remind_before_min: 30

  - title: 体检
    date: 2026-10-08
    start: "08:00"
    end: "11:00"
    location: 市第一医院
    # 0 表示到点才提醒
    remind_before_min: 0

# ---------------------------------------------------------------------------
# 提醒默认值 (上面的条目省略 remind_before_min 时用它)
# ---------------------------------------------------------------------------
defaults:
  remind_before_min: 10
