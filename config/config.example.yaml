# ============================================================================
#  config/config.example.yaml — 全局配置模板
#
#  用法:
#      cp config/config.example.yaml config/config.yaml
#      然后按需修改 config/config.yaml
#
#  ⚠ config/config.yaml 不进 git (见 .gitignore); 本模板文件才进 git。
#  ⚠ agent/config.py 不做 schema 校验, 字段的合法性由各模块自己检查;
#     本文件里的注释就是各字段的事实约定来源。
#
#  谁读哪一段 (归一化 D 系列: 配置真源统一到本文件)
#  ---------------------------------------------------------------------------
#      agent/  (PC 交叉编译后部署到板端)  读 llm / sunshine / ipc / terminal / scheduler
#      gui/    (板端 Qt5 程序)            读写 gui / llm
#      llm/config/llm.env                 由本文件派生(喂 llama-server), **不是真源**
#
#  ⚠ 归一化 D 系列已完成: GUI 的界面参数已全部并进本文件的 gui: 段,
#     GUI 不再有独立的配置文件(已随 D 系列删除)。谁写、谁读、谁派生的
#     完整约定见 docs/config-sources.md。
# ============================================================================

llm:
  # 推理位置。三个合法值 (见 agent/llm/provider.py 的 MODES):
  #   edge     板端本地模型 —— **llama.cpp GGUF**, 经 OpenAI 兼容接口访问本机 llama-server
  #            (base_url = http://127.0.0.1:<port>/v1, 端口就是下面的 port; 与 cloud 共用
  #             一套客户端与**同一个工具循环**, 所以 edge 也能 function call)
  #            别名 board / local
  #   cloud    调远端 OpenAI 兼容 API
  #   disabled 不调模型, 走 RuleEngine 规则兜底 (只回问候/时间/状态)
  # ⚠ Agent **不加载 GGUF、不跑推理**: 真正加载模型的是 llama-server 进程。
  # ⚠ edge 挂了怎么办: 请求失败时**退回规则兜底**并在日志里记一条 warning
  #    ("LLM 降级为规则兜底: ..."), 不假装是模型答的。
  # ⚠ 模型还没装好之前保持 disabled, 系统照样起得来
  mode: disabled

  # ---- mode=edge: 本地模型 ----
  # GGUF 路径 —— **由 llama-server 加载**; Agent 只把它打进日志 (不自己读模型文件)
  model_path: /home/kickpi/model/Qwen3-0.6B-Q4_K_M.gguf
  # 单次回复的 token 上限 —— **不是**上下文长度 (上下文由 llama-server 的 --ctx-size 决定)
  # ⚠ 设太小会把 Qwen3 的思考内容截断成"正文为空"(finish_reason=length); 详见 local_api_key 下面的说明
  max_tokens: 512
  # 采样温度
  temperature: 0.7

  # ---- mode=cloud: 远端 API ----
  api_base: https://api.example.com/v1
  # ⚠ 这是**云端**的 key (Agent 用); 本地 llama-server 的 key 见下面的 local_api_key
  api_key: ""
  model: gpt-4o-mini
  # 单次请求超时(秒) —— edge / cloud 都用它。
  # ⚠ 板端 edge 实测（T7-4）: 调完工具**之后**那一轮请求会带上工具结果, 0.6B 在 RK3568 上
  #    常超过 30 s（日志里就是 `APITimeoutError: Request timed out.` → 回退成规则兜底,
  #    于是"壁纸换了但回话像失败"）。90 s 是实测够用的值; 云端可以调小。
  timeout_s: 90

  # ---- 板端 llama-server (edge 模式) ----
  # ⚠ 这一组**两边都用**: 一边派生 llm/config/llm.env 喂 llama-server 进程,
  #    另一边 Agent (edge 模式) 自己读这几个键去连它 —— 见下面对每个键的标注。
  #    (agent/config.py 不做 schema 校验, 多余键没有副作用)
  model_name: qwen3-0.6b     # Agent 读: 请求里的 model (llama-server 的 --alias)
  port: 9000                 # Agent 读: base_url = http://127.0.0.1:<port>/v1
  # 上下文长度 —— **只给 llama-server** (`--ctx-size`)。
  # ⚠ T8-5 板端实测（7 个工具, `/tokenize` + usage.prompt_tokens）:
  #    · 第一轮 prompt 1898 token, 其中**工具清单就占 ~1700**（system 44 + 用户那句 6）;
  #    · 模型答一条工具调用只花 ~200 token; 把工具结果喂回去的**第二轮 2131 token**。
  #    → 2048 装不下任何一个工具往返（llama-server 报 `exceed_context_size_error` 400,
  #      Agent 降级成规则兜底, 用户看到的是"听不懂这句话"）。4096 留了余量;
  #      KV 缓存约多占 200+MB（板子 4GB / 可用 1.6GB 时没问题）。
  #    ⚠ **加工具/改工具说明等于加 prompt**: 每加一个工具大约 +200~400 token,
  #      改完记得回来看这个数（`next_wallpaper` 的说明里塞了整份标签词表, 一个就 392）。
  ctx_size: 4096
  batch_size: 256            # 只给 llama-server
  threads: 4                 # 只给 llama-server
  threads_batch: 4           # 只给 llama-server
  # llama-server 自己的 API key (派生到 llm.env 的 LLM_API_KEY; Agent 读: 请求带的 key)
  local_api_key: ***REMOVED-LLM-KEY***
  #
  # ---- 让 Agent 管 llama-server 的启停 (T7-4) ----
  # false (默认) = Agent **不碰**这个进程: 服务由你/GUI 的「启动服务」按钮管
  # true         = mode=edge 时由 Agent 管:
  #                  · Agent 启动 / 离开 SLEEP -> 跑 llm/scripts/start.sh
  #                  · 进入 SLEEP            -> 跑 llm/scripts/stop.sh（睡觉不占 CPU/内存）
  #                ⚠ 只调 llm/scripts/ 里那两个脚本（PID 文件/日志都在那儿维护, 与 GUI 的
  #                  「启动服务」按钮**同一条路**）, 不自己 fork 进程。
  #                ⚠ 起完**不等**模型加载完: 后台探一次 /v1/models 只写日志
  #                  （"llama-server 就绪 (等了 23.4 s)"）; 没就绪时 edge 照旧降级到规则兜底。
  #                ⚠ mode 不是 edge 时这个开关**无效**（cloud/disabled 没有本机服务这回事）。
  #                ⚠ Agent **退出时不停服务**（退出不等于"睡觉"）; 要停就进 SLEEP 或手动停。
  manage_service: false
  #
  # ⚠ Qwen3 的思考模式: Agent 在 edge 模式的 system 提示末尾加 `/no_think` 把它关掉。
  #    板端实测 (Qwen3-0.6B-Q4_K_M + llama-server build 10677): 不关的时候普通提问会把
  #    token 预算全烧在思考上, 正文是空字符串 —— 0.6B 上思考并不换来更好的答复。
  #
  # ⚠ llm.env 里另有 5 个与部署布局有关的键 (LLM_HOST / LLM_LOG_DIR / LLM_RUN_DIR /
  #    LLM_PID_FILE / LLM_LOG_FILE) **不在**映射表里 —— 它们由 llm.env 自己维护。
  #    同步是"文本级替换", 只改映射到的那几行, 不会动它们。

# ---------------------------------------------------------------------------
# 视觉: SigLIP 双塔 (Phase 7 T7)
# ---------------------------------------------------------------------------
# 用途: **离线**给壁纸打标签 / 按内容检索 (Agent 启动路径不加载它)。
# 跑在 NPU 上, 模型是板端本地的 rknn; 打标签走 `assistant tag` (见 docs/tagging.md)。
#
# ⚠ 这里只配"文件放哪儿 / 怎么跑"; **模型契约写死在代码里**
#    (agent/vision/siglip/config.py 的常量): 256×256、3 通道、nhwc、
#    **uint8 原始 0-255**、64 token、pad=1、768 维、L2 归一化、只能按余弦。
#    原因: 这些值改错**不报错、只会静默变笨** —— 实测喂 0-1 浮点时不同图的余弦
#    全挤在 0.98+, 判别力全丢。换模型 = 改常量 + 重跑参考向量, 不是"在这里试试"。
# ⚠ int8 那份 (siglip_full_int8.rknn) 实测**不可用**: 文本塔量化过度,
#    不同文本得到几乎相同的 embedding; 别指到这里。
vision:
  # 完整双塔 rknn (图像塔 + 文本塔)。板端文件, 不入库。
  model_path: /home/kickpi/model/siglip_full.rknn
  # tokenizer.json (HF google/siglip-base-patch16-256)。板端需要 tokenizers 库:
  #   pip3 install --no-deps tokenizers==0.20.3
  tokenizer_path: /home/kickpi/model/siglip_tokenizer/tokenizer.json
  # 仅用于日志/排障: 模型加载失败时要知道是哪个 librknnrt (实测需 >= 1.6.0)
  runtime_lib: /usr/lib/librknnrt.so
  # rknnlite 自己的日志 (排障时打开)
  verbose: false
  # 首帧之前空跑几次: 首次推理含内存分配, 计时必须丢掉它
  warmup_runs: 1

# ---------------------------------------------------------------------------
# 音乐 (Phase 7 T8)
# ---------------------------------------------------------------------------
# 目标: 对话里点歌/控制播放, **声音从 PC 出**, 而 PC 上**没有任何我们写的程序**。
#
#   PC 侧（我们一个字都不写）            板端（我们只写这一层）
#   ─────────────────────────────        ─────────────────────────────
#   neteasecli （第三方 CLI, 已登录）  ◀── ssh ──  agent/net/netease_cli.py
#   mpv         （第三方播放器, 出声）
#
# ⚠ 通道为什么是 ssh: PC 侧只允许"系统组件 + 第三方工具" —— Windows 自带
#    OpenSSH Server 属于前者（一次性开好, 不是常驻程序）, 而且是**唯一能读回输出**
#    的通道（Sunshine 的输入注入能跑命令但读不回, 那样进度只能瞎猜）。
#    一次性配置步骤（管理员 PowerShell + 板端公钥）见 docs/music.md。
# ⚠ 登录态在 **PC 上**（neteasecli 自己存的: `%USERPROFILE%\.config\neteasecli\profiles\`
#    `<profile>\session.json`，从浏览器导入）—— 板端**不存 cookie、也不碰它**。
#    T8-7 核对过: Agent 代码里没有任何地方读 `config/netease_cookie.json`
#    （.gitignore 里那条是 T8-1 留下的保险, 防的是"万一有人手动放过一份"）。
#    登录态失效时板端会如实说"在 PC 上重跑 `neteasecli auth login`"（docs/music.md §6）。
music:
  # 关掉它 = 音乐工具全部不装（与其它工具"缺依赖就跳过"同一条口径）
  enabled: false
  # neteasecli 在哪台机器上（就是那台会出声的 PC）
  pc_host: 192.168.137.1
  pc_user: Anorak
  pc_port: 22
  # PC 上那个 CLI 的名字（npm 全局装好就在 PATH 上）
  binary: neteasecli
  # 单次远程调用超时(秒) —— neteasecli 自己也有限制, 这里包一层
  timeout_s: 45

  # ---- 自动补歌 (T10-4: 队列保持 30 首, 缺就补) ----
  # 两段式: ① 先吃**本地库**（按画像排: 歌手权重 + 心情 + 听得最少的）
  #         ② 还是不够 -> **按画像里的歌手**去 PC 搜（唯一会"出去找"的路; 你定的）
  # ⚠ 搜到的歌会**进本地库**（用搜索结果里的元数据, 不再逐首 track_detail）——
  #   所以本地库会自己长大; 之后优先从本地库补, 出去的次数自然变少。
  # ⚠ 补进来的歌也可能是 VIP/无版权: 播不到就跳过它并记一笔（队列自愈）。
  autofill:
    enabled: true
    target: 30              # 队列目标长度（当前 + 后面 29 首）
    by_artist: true         # 只按歌手搜（不做关键词/风格搜索）
    search_per_cycle: 3     # 每个轮询周期最多搜几个歌手
    search_limit: 10        # 每个歌手最多收几首
    search_backoff_s: 300   # 某个歌手搜失败后多久不再试

  # ---- 本地音乐库（**不再依赖云歌单**）----
  # 一行一首歌: id + tags + 播放次数。云歌单只用来**导入一次 id**。
  # 进 .gitignore（这是"这台机器听过什么"）。
  library_file: config/music_library.jsonl
  # 只有真的听了 N 秒才算"播放一次"（避免点开就切把次数刷上去）。
  # 次数是"下一首由 chat 决定"的主要依据（听得最少的先）。
  count_after_s: 30

# ---------------------------------------------------------------------------
# B 站视频 (Phase 7 T11)
# ---------------------------------------------------------------------------
# 目标: GAME 模式下 **画面认出你在玩什么**（或你在对话里点名）-> 去 B 站搜一批
# 排成队列 -> 封面与地址推给 GUI -> **你点预览图/上一集/下一集才开始播**。
# 视频在**板端**放, 内容只在缓冲里、**不落盘**; 完整说明见 docs/bilibili.md。
#
# ⚠ 三条板端实测定下来的硬约束 (改链路前先看 docs/bilibili.md §1):
#    · 板端 souphttpsrc **是坏的** -> GUI 启动时把它的 rank 压到 0
#      (GST_PLUGIN_FEATURE_RANK=souphttpsrc:0), 播放器就自动改用板上的 **curlhttpsrc**;
#    · 而 **FIFO 那条路播放器读不动** (playbin 对 FIFO 读到 0 字节: size 恒为 0、不可 seek,
#      preroll 过不去) -> 供流走 **本机 HTTP** (只绑 127.0.0.1, chunked 边下边喂);
#    · 直链与封面**都要带 UA + Referer**, 否则 CDN 回 403;
#    · 解码靠板端已装的 **MPP 硬解** (mppvideodec), ffmpeg **只做重封装、不转码**。
bilibili:
  # 关掉它 = B 站工具整个不装、队列/缓冲/观察器都不起 (与音乐同一条口径)
  enabled: true

  # ---- 凭据 (清晰度) ----
  # 板端手写的 JSON: {"SESSDATA": "...", "bili_jct": "...", "DedeUserID": "..."}
  # **已进 .gitignore, 永远不要提交** (docs/config-sources.md §2)。
  #   · 文件不在 / 为空  -> 匿名, 单文件阶梯 (实测 360P~720P, 视视频而定)
  #   · 有 SESSDATA      -> DASH 可以到 1080P (ffmpeg 合流, 播放端硬解)
  # ⚠ 键名写错 (例如多打一个 E 的 `SEESSDATA`) B 站不认: 代码会认下来并提醒,
  #   实测那种写法 nav 回 -101。实际拿到多少清晰度就报多少, **界面上一处都不显示**,
  #   只作为一条聊天气泡如实说 (你定的)。
  cookie_file: config/bilibili_cookie.json
  # 单次 HTTP 超时(秒)。板端到 B 站接口实测够用。
  timeout_s: 15

  # ---- 队列 (滑动窗口) ----
  # 目标长度 = 3 × GUI 预览栏能放下的格数 N (GUI 上报 bilibili_viewport{visible:N})。
  # 上一集往**前**补一页、下一集往**后**补一页; 偏离太远的另一侧丢掉。
  queue:
    # GUI 还没上报格数时的兜底 (6 格 -> 18 条)
    viewport_fallback: 6
    # 窗口硬上限: 防止"窗口拉得特别大"把队列推到几百条
    max: 60

  # ---- 缓冲 (内存滑动窗口, 全程不落盘) ----
  buffer:
    # 供流方式: http = **本机 HTTP**(默认, 播放器唯一能走通的那条, 只绑 127.0.0.1);
    #          fifo = 老路子, 留给 dd/cat 这类哑读端排障用 (**播放器读不动**, 别在板端改回去)
    transport: http
    # 本机 HTTP 端口(端口被占会自动换一个, 换到的那个会如实推给 GUI)
    port: 8765
    # transport: fifo 时管道路径放哪个目录 (每换一条都会新建一个 bilibili-<bvid>.ts)
    dir: /tmp
    # 起播门槛: 攒够这么多秒才把流交给播放器 (没攒够会说一句"网络慢")
    initial_s: 15
    # 封顶: **播放中**领先 initial_s; **暂停时**放宽到这么多秒 (你定的)
    # ⚠ 走 http 之后播放器能一口气把整段吞进去, 所以这条封顶是**缓冲代理自己限速**
    #   实现的 (喂出去的不超过"已过时间 + 封顶"), 不是靠管道背压。
    max_s: 60
    # 内存水位: MemAvailable 低于它就停止预取, 让管道堵住 ffmpeg (天然背压)
    mem_watermark_mb: 400

  # ---- 画面 -> 游戏 (双路识别 + 自纠错) ----
  game_watch:
    # 关掉"问 PC 进程"这一路 = 只靠画面锚点 (认不出就什么都不做)
    enabled: true
    # 多久认一次 (秒)。只在 GAME 模式跑; **有对话关键词就整个跳过** (一帧都不抓)
    interval_s: 60
    # "有把握"的门槛 (T11-0 标定: 13 张里认 6 张、零误判) —— 不够就问 PC 进程
    confident_score: 0.82
    confident_margin: 0.05
    # 锚点索引 (派生数据, 已进 .gitignore)。一行一锚点:
    # 游戏名 + 768 维向量 + 截图路径 + 来源 + 时间; 截图在同目录的 <游戏>/ 下
    anchor_file: config/game_anchors.jsonl
    # 进程名 -> 游戏名。**进程路是"真值"**: 画面与它不一致时以它为准, 并把那一帧
    # 记成该游戏的锚点 (自纠错)。⚠ 窗口标题在 sshd 的 session 0 里恒为空, 拿不到,
    # 所以只能按**进程名**认 (名字可以带 .exe, 比较时不区分大小写)。
    process_names:
      WHITE ALBUM Memories like Falling Snow.exe: white album
      hatsuyuki.exe: 初雪樱
      Amakano3.exe: 甜蜜女友3
      hoi4.exe: hearts of iron iv
      stellaris.exe: stellaris
    # 加载/保持 SigLIP 之前先看 MemAvailable (与 buffer.mem_watermark_mb 同一个意思)
    mem_watermark_mb: 400
  # ⚠ 这一路复用 `music:` 段的 ssh 配置 (pc_host / pc_user / pc_port / ssh) ——
  #   音乐与认游戏问的是**同一台 PC**, 不另配一套。

# ---------------------------------------------------------------------------
# 壁纸 (Phase 7 T3)
# ---------------------------------------------------------------------------
wallpaper:
  # 壁纸目录。Agent **只读**它, 一次只看文件名与后缀:
  #   · 认 .jpg / .jpeg / .png / .webp / .bmp (不含 .gif: 壁纸要的是静态图)
  #   · 按**文件名**排序 (想控制顺序就加编号: 01_、02_…)
  #   · 每次"下一张"都重新列一遍目录 —— 随时丢新图进去, 不用重启 Agent
  #   · 目录不存在/是空的: 换壁纸会失败并回一句说明; **不影响 Agent 启动**
  # ⚠ 图片能不能解码是 GUI 的事: 读不到时 GUI 给兜底底色 + 橙字提示, 不崩。
  # ⚠ 目录在仓库外面 (板端 /home/kickpi/wallpapers), 所以图片不入库。
  dir: /home/kickpi/wallpapers

  # ---- 三格窗口 (T10: 上一个 / 当前 / 下一个) ----
  # 窗口本身固定三格 (`agent/core/wallpaper.py::WINDOW_SIZE`), 没有可调的;
  # "下一个"由**用户画像**决定（T9/T10-2 的 rank_wallpapers）, 画像还没攒够时
  # 回退到"按文件名往后"。这里不用配任何键 —— 留这一段是告诉读配置的人:
  # 壁纸的换图逻辑不在配置里, 在 `wallpaper.py` + `user_profile.py`。

  # ---- 标签化 (Phase 7 T7) ----
  # 三轴: scene 场景 / tone 色调 / mood 氛围。词表默认写在
  # agent/vision/tag_vocab.py (英文裸标签 + 中文显示名); 这里只能**追加**。
  # 用手册见 docs/tagging.md; 打标签用 `assistant tag` (默认只看, --apply 才写)。
  tagging:
    # 标签数据文件 (派生数据, 不是配置真源; 已进 .gitignore)。
    # 一行一张图: 三轴 top-k + L2 归一化后的图像向量 (base64 float16) ——
    # 向量存下来是为了 "IP 检索/相似图召回"**不用再过 NPU**。
    data_file: config/wall_data.jsonl
    # 每轴存几条候选。刻意多存几条: 阈值是**查询期**的事, 存宽一点,
    # 以后标定阈值/改筛选口径都不用重打标签。
    top_k: 3
    # 追加词表 (英文裸标签; 想删默认标签就改 tag_vocab.py 并重跑 assistant tag)。
    # 例: scene: [cyberpunk, mecha]
    vocab: {}
    # IP 锚点: 每个 IP 给 1–2 张**确认过的图**当原型向量 —— 检索是"像不像锚点",
    # 不要求模型认识这个作品名 (SigLIP 不认识具体 IP; 文本查询只做兜底)。
    # ⚠ anchors 写**文件名** (相对 wallpaper.dir), 换图/改名后要跟着改。
    ip_presets:
      GBC:  {query: GIRLS BAND CRY, anchors: [9b22df807668f01f55ea87394d90103b159047704.png]}
      EVA:  {query: Evangelion, anchors: [Rei_1.png, wallhaven-85j9qo_2560x1080.png]}
      KNK:  {query: Kara no Kyoukai, anchors: [wallhaven-95y5md_2560x1600.png]}
      SC:   {query: THE IDOLM@STER SHINY COLORS, anchors: [wallhaven-k7le6q_1920x1080.png]}
      Nier: {query: "NieR: Automata", anchors: [wallhaven-kxpyy1_2560x1440.png, wallhaven-3l78rd_2560x1440.png]}
      SNF:  {query: Sousou no Frieren, anchors: [wallhaven-858vpj_1200x1920.png]}
      "2077": {query: Cyberpunk 2077, anchors: [wallhaven-jx1ex5_3840x2160.png]}
      GitS: {query: Ghost in the Shell, anchors: [wallhaven-zy31jv_3840x2160.png, wallhaven-0jdkvq_3840x2160.png]}

# ---------------------------------------------------------------------------
# Sunshine 串流主机
# ---------------------------------------------------------------------------
sunshine:
  # 主机地址; 从板端访问宿主机时填宿主在局域网里的地址
  host: 192.168.137.1
  # GameStream HTTP 端口 (配对用; /serverinfo /applist /launch 在它上面**没有**)
  port: 47989
  # HTTPS 端口: /serverinfo /applist /launch /resume 都在这里, 且需要客户端证书。
  # 缺这个键时代码按 47984 处理 —— 板端那份旧配置不改也能跑。
  https_port: 47984
  # 应用名或 appid (Sunshine 的 /applist 里能看到)
  app: Desktop
  # 期望的流参数
  width: 1280
  height: 720
  fps: 60

  # 客户端证书 (配对时生成, 必须两个文件都在)
  cert: /home/kickpi/myproject/assitant/creds/client.pem
  key: /home/kickpi/myproject/assitant/creds/client.key

# ---------------------------------------------------------------------------
# 进程间通信 (Agent 是 server, GUI 是 client)
# ---------------------------------------------------------------------------
ipc:
  # 走本机 Unix domain socket, 不占端口也不经网卡 (线格式见 docs/ipc-protocol.md)。
  # 一般不用改; 只有测试/并行跑时才需要换个路径。
  socket_path: /tmp/agent.sock
  # 每个 GUI 连接的发送队列长度。GUI 一时消费不过来时丢最旧的一条状态快照,
  # 不会把它踢掉, 也不会卡住 Agent。
  queue_size: 128

# ---------------------------------------------------------------------------
# 本机终端输入 (两个输入源之一: 终端 / GUI)
# ---------------------------------------------------------------------------
terminal:
  # 没有 GUI/IPC 时, 这是唯一能直接敲字的通道; 服务型进程没有 stdin 会自动跳过
  enabled: true

# ---------------------------------------------------------------------------
# 调度器
# ---------------------------------------------------------------------------
scheduler:
  # 每多少分钟检查一次日程
  interval_min: 1
  # 触发窗口宽度(分钟)
  window_min: 1
  # 迟到的容忍度(分钟): 设备休眠/重启后晚几分钟仍认这次触发
  late_grace_min: 0
  # 一次性日程触发后, 自动把它从**本文件**里删掉 (R3)。
  #   · 只对 oneoff 生效; recurring 删了明天就不响了, 所以一条都不动
  #   · 做的是**文本级**删除: 只删属于那条的行, 注释与顺序原样保留;
  #     写之前会重新读一遍并核对 state/date/start, 对不上就不删;
  #     原文件旁留一份 config.yaml.bak (第一次写前会覆盖上一份)
  #   · 默认 false: 这是"程序自动改真源"的行为。打开前想清楚: Agent 会成为
  #     config.yaml 的第二个写入者 (另一个是 GUI 的设置页/模型页)
  remove_fired_oneoff: false

  # -------------------------------------------------------------------------
  # 日程: recurring (每周固定) / oneoff (只有那一天)
  #
  # T12-4 起 **日程的内容只有「时间 + 状态」**:
  #   到点了就把设备切到那个状态; 切换严格走状态机 (要经过 IDLE 释放/接管资源,
  #   见 docs/architecture.md 的"状态转换"一节), 同时往对话区推**一行**显示文本。
  #   ⚠ 这一行**不进 LLM** —— 日程是"到点照做", 不是给模型的一句话。
  #
  # 下面这些是**会被读**的键 (agent/core/scheduler.py 的 ScheduleEvent.from_config)。
  # 写成注释而不是真条目: 模板里不放真日程, 免得刚 clone 下来就凭空多出切换。
  # 要加日程就把这几行抄下来、取消注释 (或者让工具 `set_schedule` 代写)。
  #
  #   recurring:
  #     - state: study          # 必填: sleep | idle | study | game
  #       days: [mon, tue, wed] # 星期缩写 mon..sun (或 0..6); 不写 = 每天
  #       start: "09:30"        # 必填 "HH:MM" (也收 9:30 / 0930)
  #   oneoff:
  #     - state: sleep
  #       date: 2026-09-20      # 必填 YYYY-MM-DD; 与 days **互斥**
  #       start: "22:30"
  #
  # ⚠ 老字段 `title` / `end` / `remind_before_min` / `prompt` **不再生效**:
  #   出现了会当没写, 并在启动日志里逐条说明该怎么照做 (不报错, 免得老配置起不来)。
  #   ⚠ 一条日程要是**没有 state**, 那条会被跳过并记一条警告
  #     (老配置里那些"纯提醒"条目就是这个下场), 其余日程照常工作。
  # ⚠ 这几个键**没有任何读取者**, 写了也不生效 (不要再往这里加):
  #     timezone / defaults.remind_before_min / location
  # -------------------------------------------------------------------------
  recurring: []
  oneoff: []

  # 终端命令映射: 命令名 -> 动作 (state 切状态 / prompt 发消息 / reason 说明)
  # 只认来自终端的那一行, 且要求**整行相等**(去首尾空白、大小写不敏感)。
  # 例:
  #   commands:
  #     - command: "study"
  #       action: {state: study, prompt: "开始学习"}
  #     - command: "回桌面"
  #       action: {state: idle}
  # 也可以用 "命令名: 动作" 的 dict 写法。
  # ⚠ 命中不会把事件从 bus 里拿走, 所以命令那行**同时也会进 LLM**(订阅式的固有行为)。
  commands: []

# ---------------------------------------------------------------------------
# 用户画像 (T9: 纯对话攒够了就归纳一次 —— **不是工具**, 模型看不到)
# ---------------------------------------------------------------------------
#  它读三样东西: 纯对话（内存里那段, 不落盘）、`config/wall_data.jsonl` 的用量 +
#  IP 锚点、`config/music_library.jsonl` 的播放次数与歌手; 写一行到
#  `config/user_profile.jsonl`（一次构建一行, 已进 .gitignore）。
#  ⚠ 心情那一步会**问一次模型**（edge 就是本机 llama-server; cloud 就发云 —— 两边同一套）。
#  ⚠ 触发者只有 Agent 一个（纯对话攒到 trigger_chars 字, 或 trigger_turns 轮兜底）;
#    用户在对话里说什么都触发不了它, 模型也调不到它。
profile:
  enabled: true
  trigger_chars: 2000      # 自上次构建以来攒到这么多字就构建一次
  trigger_turns: 12        # 兜底: 短消息太多时按轮数触发
  # file: config/user_profile.jsonl   # 默认就在这儿; 相对路径按仓库根解析

# ---------------------------------------------------------------------------
# GUI (板端 Qt5 程序 gui/)
# ---------------------------------------------------------------------------
#  这一段的键路径都以 `gui.` 开头 (例如 gui.wake.idle_ms)。
#  GUI 用**文本级替换**读写本段: 只改目标行的值, 注释与顺序原样保留 ——
#  所以它不会动到上面的 llm / sunshine / ipc / terminal / scheduler 段。
#
#  ⚠ 本段由 GUI 拥有, Agent 不读它 (改这里不影响 Agent 行为)。
#  ⚠ SigLIP 是固定的 (siglip_full.rknn), 不在这里提供开关 ——
#    按约定"统一为 sig 固定, 只有 llm 配置可改"。
gui:
  # ---- 界面 ----
  theme: grey              # 高级灰 (当前只有这一档)
  fullscreen: true         # 启动即全屏 kiosk (--windowed 可临时覆盖)
  start_page: home         # home | model | system | settings
  debug: false             # 开: 日志输出每条收到的报文与连接细节 (界面不显示标记)

  # ---- 唤醒 (四个区域) ----
  wake:
    top: locked            # locked = 常显; active = 空闲后自动隐藏
    bottom: active
    left: active
    right: locked
    idle_ms: 5000          # 统一休眠时间 (四个活动区共用这一个值; 视频控制条不共享)

  # ---- 视频控制条 (内嵌在画面里) ----
  # 与四个区域一样有 活动/锁定, 但**时间单独设置**, 不跟 wake.idle_ms 共享
  video_overlay:
    mode: active           # locked = 常显; active = 空闲后自动隐藏 (点一下再出现)
    idle_ms: 3000          # 只作用于内嵌控制条

  # ---- 对话 / 输入 ----
  chat_channel: via_agent  # 主页面对话只走 agent (chat_input -> llm)
  input_source: keyboard   # keyboard | terminal (只有 keyboard 会真控 onboard)
                           # 原来的 "pc"(用宿主机键盘当输入源) 已随主机输入方向一起移除
  onboard_auto: true       # 选"键盘"时，**点输入框才弹** onboard，输入框失焦自动关
                           # (S10 起不在启动/切输入源时弹 —— 免得一开机键盘盖住主区)

  # ---- 系统监控 ----
  monitor_interval_ms: 1000

  # ---- 日程区 ----
  # 日程区最多显示几行（**今天 + 明天两段合计**；超出的在末尾显示"还有 N 项"）。
  # ⚠ 日程内容本身**不在这里**：GUI 只**读**本文件的 scheduler 段
  #    （recurring / oneoff）做展示，日程的增删改仍然改那一段。
  #    为什么这么设计、以及"两边语义只保证等价到夹具覆盖的范围"，见
  #    docs/config-sources.md。
  max_rows: 6

  # ---- 视频 (游戏模式主区) ----
  video:
    speed: 1.0             # 0.5 - 3.0
    fullscreen: true
