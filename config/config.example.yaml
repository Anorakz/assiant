# ============================================================================
#  config/config.example.yaml — 全局配置模板
#
#  用法:
#      cp config/config.example.yaml config/config.yaml
#      然后按需修改 config/config.yaml
#
#  ⚠ config/config.yaml 不进 git (见 .gitignore); 本模板文件才进 git。
#  ⚠ agent/config.py 不做 schema 校验, 字段的合法性由各模块自己检查;
#     本文件里的注释就是各字段的事实约定来源。
# ============================================================================

llm:
  # 推理位置。三个合法值 (见 agent/llm/provider.py 的 MODES):
  #   edge     板端本地小模型 (RKNN); 别名 board / local
  #   cloud    调远端 OpenAI 兼容 API
  #   disabled 不调模型, 走 RuleEngine 规则兜底 (只回问候/时间/状态)
  # ⚠ 模型还没装好之前保持 disabled, 系统照样起得来
  mode: disabled

  # ---- mode=edge 时使用 ----
  model_path: /home/kickpi/myproject/assitant/models/llm.rknn
  # 上下文长度上限, 超过要截断
  max_tokens: 512
  # 采样温度
  temperature: 0.7

  # ---- mode=cloud 时使用 ----
  api_base: https://api.example.com/v1
  api_key: ""
  model: gpt-4o-mini
  # 单次请求超时(秒)
  timeout_s: 30

# ---------------------------------------------------------------------------
# Sunshine 串流主机
# ---------------------------------------------------------------------------
sunshine:
  # 主机地址; 从板端访问宿主机时填宿主在局域网里的地址
  host: 192.168.137.1
  # GameStream HTTP 端口 (握手 / serverinfo / pair)
  port: 47989
  # 应用名或 appid (Sunshine 的 /applist 里能看到)
  app: Desktop
  # 期望的流参数
  width: 1280
  height: 720
  fps: 60

  # 客户端证书 (配对时生成, 必须两个文件都在)
  cert: /home/kickpi/myproject/assitant/creds/client.pem
  key: /home/kickpi/myproject/assitant/creds/client.key

# ---------------------------------------------------------------------------
# 进程间通信 (Agent 是 server, GUI 是 client)
# ---------------------------------------------------------------------------
ipc:
  # 走本机 Unix domain socket, 不占端口也不经网卡 (线格式见 docs/ipc-protocol.md)。
  # 一般不用改; 只有测试/并行跑时才需要换个路径。
  socket_path: /tmp/agent.sock
  # 每个 GUI 连接的发送队列长度。GUI 一时消费不过来时丢最旧的一条状态快照,
  # 不会把它踢掉, 也不会卡住 Agent。
  queue_size: 128

# ---------------------------------------------------------------------------
# 本机终端输入 (第三个输入源: 终端 / GUI / 主机键盘)
# ---------------------------------------------------------------------------
terminal:
  # 没有 GUI/IPC 时, 这是唯一能直接敲字的通道; 服务型进程没有 stdin 会自动跳过
  enabled: true

# ---------------------------------------------------------------------------
# 调度器
# ---------------------------------------------------------------------------
scheduler:
  # 每多少分钟检查一次日程
  interval_min: 1
  # 触发窗口宽度(分钟)
  window_min: 1
  # 迟到的容忍度(分钟): 设备休眠/重启后晚几分钟仍认这次触发
  late_grace_min: 0
  # 主机输入轮询间隔(毫秒)
  host_input_interval_ms: 50
  # 快捷键映射: 组合键 -> 动作 (state 切状态 / prompt 发消息)
  hotkeys: []
